worker_processes 1;

events {
    worker_connections 1024;
}

http {
    sendfile on;

    # Редирект с HTTP на HTTPS (только для основного сайта)
    server {
        listen 80;
        server_name localhost xn--80aeecdfa4anm4ag.xn--p1ai www.xn--80aeecdfa4anm4ag.xn--p1ai xn--80apbahcjkbhv3b3d.xn--p1ai www.xn--80apbahcjkbhv3b3d.xn--p1ai;

        return 301 https://$host$request_uri;
    }

    # HTTP сервер для CRM (без SSL, чтобы браузер не блокировал доступ)
    server {
        listen 80;
        server_name crm.микронаушники.рф crm.xn--80aeecdfa4anm4ag.xn--p1ai;

        location / {
            proxy_pass http://twenty:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
        }
    }

    # Основной HTTPS сервер
    server {
        listen 443 ssl;
        server_name localhost xn--80aeecdfa4anm4ag.xn--p1ai www.xn--80aeecdfa4anm4ag.xn--p1ai xn--80apbahcjkbhv3b3d.xn--p1ai www.xn--80apbahcjkbhv3b3d.xn--p1ai;

        # Сертификаты
        ssl_certificate /etc/nginx/certs/fullchain.crt;
        ssl_certificate_key /etc/nginx/certs/privkey.key;

        # Базовые заголовки для микросервисов
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;

        # CORS
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Session-ID' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # 1. Защита Swagger снаружи
        location ~ ^/(api/.*)/(docs|redoc|openapi\.json) {
            return 404;
        }

        # 2. МАРШРУТИЗАЦИЯ К МИКРОСЕРВИСАМ

        # Авторизация и пользователи (user_service)
        location /api/auth/ {
            proxy_pass http://user_service:8000/;
        }

        # Запросы к профилю /api/users/me и сбросу пароля
        location /api/users/ {
            # Явно меняем /api/users/... на /users/...
            rewrite ^/api/users/(.*)$ /users/$1 break;
            
            # Отправляем в сервис без суффиксов, Nginx передаст то, что получилось после rewrite
            proxy_pass http://user_service:8000;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Authorization $http_authorization;
        }

        # Товары (product_service)
        location /api/products/ {
            proxy_pass http://product_service:8000/;
        }

        # Заказы (order_service)
        location /api/orders/ {
            proxy_pass http://order_service:8000/orders/;
            proxy_set_header X-Session-ID $http_x_session_id;
        }
        
        # Корзина (order_service)
        location /api/cart/ {
            proxy_pass http://order_service:8000/cart/;
            proxy_set_header X-Session-ID $http_x_session_id;
        }

        # Аренда (rent_service)
        location /api/rent/ {
            proxy_pass http://rent_service:8000/;
        }

        # Оплата (payment_service)
        location /api/payment/ {
            proxy_pass http://payment_service:8000/;
        }

        # 3. ФРОНТЕНД (Next.js)
        location / {
            proxy_pass http://frontend:3000/;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
        # Интеграция с Twenty CRM
        location /api/admin/ {
            proxy_pass http://admin_twenty:8000/;
        }
    }
}