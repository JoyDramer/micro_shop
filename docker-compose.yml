version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: shop_db_cluster
    environment:
      POSTGRES_USER: shop_user
      POSTGRES_PASSWORD: shop_password
      POSTGRES_DB: default_db
    ports:
      - "5432:5432"
    volumes:
      - shop_postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7
    container_name: shop_redis_cache
    ports:
      - "6379:6379"

  # ДОБАВИЛИ RABBITMQ:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: shop_message_broker
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672" # Порт для общения сервисов
      - "15672:15672" # Порт для веб-интерфейса

volumes:
  shop_postgres_data:
